name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "İmza anahtarı bulundu."
          else
            echo "İmza anahtarı yok, debug anahtarı kullanılacak."
          fi

      - name: Debug APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Release APK derle (sadece etiketlerde)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Modül kontrolü (provider ve xposed dosyaları)
        continue-on-error: true
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n1)
          echo "--- provider ---"
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | grep -i -A8 "provider" || echo "provider yok"
          echo "--- META-INF/xposed ---"
          unzip -l "$APK" | grep -i "META-INF/xposed" || echo "xposed dosyaları yok"

      - uses: actions/upload-artifact@v7
        with:
          name: UygulamaKonumAldatici-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: GitHub Release oluştur (sadece etiketlerde)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$SRC" "KonumAldatici-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "KonumAldatici-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes
